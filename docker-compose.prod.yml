# ==============================================================================
# CARMATS PRODUCTION DOCKER COMPOSE DEFINITION (docker-compose.prod.yml)
#
# USAGE ON PRODUCTION VPS:
# docker compose -f docker-compose.prod.yml --env-file /opt/carmats/.env up -d
#
# IMMUTABLE DEPLOYMENT:
# Requires IMAGE_TAG environment variable (e.g. IMAGE_TAG=sha-1a7059a)
# ==============================================================================

services:

  # 1. PostgreSQL 17 Database (Internal Only)
  postgres:
    image: postgres:17-alpine
    container_name: carmats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - carmats_postgres_data:/var/lib/postgresql/data
    networks:
      - carmats-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Spring Boot 4.1.1 Backend REST API (Internal Only)
  backend:
    image: ghcr.io/abdullahturgut/vehicle-fitment-backend:${IMAGE_TAG}
    container_name: carmats-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@carmats.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ADMIN_INITIAL_FIRST_NAME: ${ADMIN_INITIAL_FIRST_NAME:-Admin}
      ADMIN_INITIAL_LAST_NAME: ${ADMIN_INITIAL_LAST_NAME:-Sistem}
    networks:
      - carmats-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Next.js 15 Standalone Frontend (Internal Only)
  frontend:
    image: ghcr.io/abdullahturgut/vehicle-fitment-frontend:${IMAGE_TAG}
    container_name: carmats-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-905550000000}
    networks:
      - carmats-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Nginx Reverse Proxy / API Gateway (Only Public Ingress)
  nginx:
    image: nginx:1.27-alpine
    container_name: carmats-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - carmats-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  carmats-network:
    driver: bridge

volumes:
  carmats_postgres_data:
