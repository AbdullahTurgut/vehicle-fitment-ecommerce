name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carmats_db
          POSTGRES_USER: carmats
          POSTGRES_PASSWORD: carmats_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        working-directory: backend/car-mats-backend
        run: chmod +x mvnw

      - name: Run Backend Tests
        working-directory: backend/car-mats-backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:postgresql://localhost:5432/carmats_db
          DB_USERNAME: carmats
          DB_PASSWORD: carmats_dev
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        run: ./mvnw clean test

      - name: Package Backend Fat JAR
        working-directory: backend/car-mats-backend
        run: ./mvnw package -DskipTests

  frontend-ci:
    name: Frontend CI (Node 22 / Vitest / Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Next.js Production App
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ''
          NEXT_PUBLIC_SITE_URL: 'http://localhost'
          NEXT_PUBLIC_WHATSAPP_NUMBER: '905550000000'
        run: npm run build

  docker-ci:
    name: Docker Compose & Image Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Verify Backend Container Build
        run: docker build -t carmats-backend:ci ./backend/car-mats-backend

      - name: Verify Frontend Container Build
        run: docker build -t carmats-frontend:ci ./frontend
