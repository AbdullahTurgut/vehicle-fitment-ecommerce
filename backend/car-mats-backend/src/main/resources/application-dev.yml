# application-dev.yml

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carmats_db}
    username: ${DB_USERNAME:carmats}
    password: ${DB_PASSWORD:carmats_dev}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    org.hibernate.SQL: DEBUG