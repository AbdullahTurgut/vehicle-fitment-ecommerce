services:

  postgres:
    image: postgres:17
    container_name: carmats-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carmats_db}
      POSTGRES_USER: ${POSTGRES_USER:-carmats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carmats_dev}

    ports:
      - "5432:5432"

    volumes:
      - carmats_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-carmats} -d ${POSTGRES_DB:-carmats_db}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carmats_postgres_data: